<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Test page: does iOS blur or tint things near the top of the screen?
     Draws black-and-white checker “probes” at fixed spots from the status bar down, plus
     the same probe mid-screen as a reference. dev/measure-top-edge.mjs compares them in a
     screenshot: identical pixels mean no blur and no overlay. Uses the template’s CSS, so it
     tests the real #top-bar. Add it to the Home Screen to test app mode.
     This copy keeps the old “black-translucent” status bar as the before case: on iOS 27
     it blurs even with a qualifying bar. dev/top-edge-default.html is the after case;
     iOS reads the style at launch, so each needs its own Home Screen install. -->
<title>Top edge test</title>
<meta name="apple-mobile-web-app-title" content="Top edge">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="top-edge.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="top-edge.css">
<script type="module" src="top-edge.js"></script>
</head>
<body>
<div id="top-bar"></div>
<div id="inset"></div>
<div id="panel"><p id="info"></p><div class="grid" id="variants"></div></div>
</body>
</html>
