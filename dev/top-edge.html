<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Test page: does iOS blur or tint things near the top of the screen?
     Draws black-and-white checker “probes” at fixed spots from the status bar down, plus
     the same probe mid-screen as a reference. dev/measure-top-edge.mjs compares them in a
     screenshot: identical pixels mean no blur and no overlay. Same <head> setup and CSS as
     the template, so it tests the real thing. Add it to the Home Screen to test app mode. -->
<title>Top edge test</title>
<meta name="apple-mobile-web-app-title" content="Top edge">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="top-edge.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
<style>
  /* Hard-edged stripes to scroll under the top band, so blur there is easy to see. */
  body { min-height: 400vh;
    background: repeating-linear-gradient(var(--page-color) 0 20px, var(--text-color) 20px 24px); }

  /* Variants, set from the URL by the script below. */
  :root { --bar-color: var(--page-color); }
  :root[data-color="accent"] { --bar-color: var(--accent-color); }
  #top-bar { background: var(--bar-color); }
  :root[data-bar="tall"] #top-bar { height: calc(env(safe-area-inset-top) + 56px); }
  :root[data-bar="none"] #top-bar { display: none; }

  .probe { position: fixed; z-index: 2; background: repeating-conic-gradient(#000 0 25%, #fff 0 50%) 0 0 / 2px 2px; }
  .swatch { position: fixed; z-index: 2; background: var(--bar-color); }
  #inset { position: fixed; top: 0; height: env(safe-area-inset-top); visibility: hidden; }

  #panel { position: fixed; z-index: 3; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface-color); font-size: 13px; line-height: 1.4; }
  #panel p { margin: 0 0 8px; }
  #panel .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #panel a { display: block; padding: 8px 4px; border-radius: 8px; text-align: center;
    background: var(--page-color); color: var(--text-color); text-decoration: none; }
  #panel a[aria-current] { background: var(--accent-color); color: var(--accent-text-color); }
</style>
</head>
<body>
<div id="top-bar"></div>
<div id="inset"></div>
<div id="panel"><p id="info"></p><div class="grid" id="variants"></div></div>
<script type="module">
  const params = new URLSearchParams(location.search);
  const bar = params.get("bar") ?? "strip";     // none | strip (the template) | tall (strip + 56px, like random-restaurant)
  const color = params.get("color") ?? "page";  // page | accent (a colored header)
  const scroll = params.get("scroll") ?? "top"; // top | under (stripes scrolled under the band)
  Object.assign(document.documentElement.dataset, { bar, color });

  const layout = await (await fetch("top-edge-probes.json", { cache: "no-store" })).json();
  const add = (cls, x, y, w, h) => {
    const el = document.createElement("div");
    el.className = cls;
    Object.assign(el.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
    document.body.append(el);
  };
  const s = layout.probeSize;
  for (const x of layout.columns) for (const y of [...layout.rows, layout.referenceRow]) add("probe", x, y, s, s);
  add("swatch", layout.swatch[0], layout.swatch[1], s * 2, s * 2);

  // In a Home Screen app iOS fills in the safe area after the first layout, so read it again later.
  const safari = navigator.userAgent.match(/Version\/([\d.]+)/)?.[1];
  const showInfo = () => {
    const inset = document.getElementById("inset").offsetHeight;
    document.getElementById("info").textContent =
      `bar=${bar} · color=${color} · scroll=${scroll} · ` +
      `${navigator.standalone ? "Home Screen app" : "Safari tab"} · inset-top ${inset}px · ` +
      `${safari ? `Safari ${safari}` : "Safari version not in app-mode UA"}`;
  };
  showInfo();
  addEventListener("resize", showInfo);
  setTimeout(showInfo, 500);

  const grid = document.getElementById("variants");
  for (const b of ["none", "strip", "tall"]) for (const c of ["page", "accent"]) for (const sc of ["top", "under"]) {
    const a = document.createElement("a");
    a.href = `?bar=${b}&color=${c}&scroll=${sc}`;
    a.textContent = `${b} ${c === "accent" ? "acc" : "pg"} ${sc === "under" ? "↓" : "–"}`;
    if (b === bar && c === color && sc === scroll) a.setAttribute("aria-current", "page");
    grid.append(a);
  }

  if (scroll === "under") requestAnimationFrame(() => scrollTo(0, 300));
</script>
</body>
</html>
