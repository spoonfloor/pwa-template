<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Between these markers is written by dev/configure.mjs from app.config.json. Edit there. -->
<!-- config -->
<title>Hello PWA</title>
<meta name="apple-mobile-web-app-title" content="Hello">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<!-- /config -->
<!-- Home Screen: opens as an app. No apple-mobile-web-app-status-bar-style on purpose: on
     iOS 27 “black-translucent” makes iOS blur the top of the screen, and WebKit asks for the
     tag to be removed. iOS colors the status bar from #top-bar instead (see app.css). -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header id="top-bar"><!-- Put the app’s title and top controls here. --></header>
<main>
  <button id="hello" type="button">Hello, world</button>
</main>
</body>
</html>
